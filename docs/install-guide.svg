<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="winShadow" x="-4%" y="-5%" width="108%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Main Canvas Background -->
  <rect width="1100" height="900" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="1098" height="898" rx="15" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===================================================================== -->
  <!-- ROW 1: STEP 1 — RUN INSTALL.BAT                                       -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 24)" filter="url(#cardShadow)">
    <rect width="1052" height="192" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Left Column: Step Description -->
    <rect x="24" y="24" width="74" height="26" rx="13" fill="#fee2e2"/>
    <text x="61" y="41" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">STEP 1</text>
    <text x="24" y="78" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Run the installer</text>
    <text x="24" y="106" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Extract the downloaded ZIP archive into</text>
    <text x="24" y="126" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">any folder and double-click</text>
    <text x="24" y="146" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">install.bat</text>

    <!-- Divider -->
    <line x1="365" y1="20" x2="365" y2="172" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Right Column: Clean Windows Explorer Screenshot -->
    <g transform="translate(390, 16)" filter="url(#winShadow)">
      <rect width="642" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Win11 Titlebar -->
      <path d="M0 8 Q0 0 8 0 L634 0 Q642 0 642 8 L642 28 L0 28 Z" fill="#f1f5f9"/>
      <rect x="12" y="8" width="14" height="11" rx="2" fill="#fbbc04"/>
      <text x="34" y="18" fill="#334155" font-family="Segoe UI, sans-serif" font-size="11">HellDownloader_Setup — File Explorer</text>
      <text x="618" y="18" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">×</text>

      <!-- Table Header -->
      <text x="20" y="46" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Name</text>
      <text x="280" y="46" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Type</text>
      <line x1="12" y1="52" x2="630" y2="52" stroke="#f1f5f9" stroke-width="1"/>

      <!-- File 1: extension -->
      <rect x="20" y="60" width="16" height="13" rx="2" fill="#fbbc04"/>
      <text x="44" y="71" fill="#1e293b" font-family="Segoe UI, sans-serif" font-size="12">extension</text>
      <text x="280" y="71" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">File folder</text>

      <!-- File 2: native_host -->
      <rect x="20" y="82" width="16" height="13" rx="2" fill="#fbbc04"/>
      <text x="44" y="93" fill="#1e293b" font-family="Segoe UI, sans-serif" font-size="12">native_host</text>
      <text x="280" y="93" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">File folder</text>

      <!-- File 3: install.bat (Selected) -->
      <rect x="12" y="102" width="390" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="20" y="108" width="16" height="14" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
      <rect x="20" y="108" width="16" height="4" fill="#0284c7"/>
      <text x="44" y="119" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">install.bat</text>
      <text x="280" y="119" fill="#0369a1" font-family="Segoe UI, sans-serif" font-size="11">Windows Batch File</text>

      <!-- File 4: uninstall.bat -->
      <rect x="20" y="135" width="16" height="14" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <rect x="20" y="135" width="16" height="4" fill="#64748b"/>
      <text x="44" y="146" fill="#1e293b" font-family="Segoe UI, sans-serif" font-size="12">uninstall.bat</text>
      <text x="280" y="146" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Windows Batch File</text>

      <!-- Clean Red Arrow -->
      <path d="M475 115 L412 115" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <polygon points="410,115 420,109 420,121" fill="#dc2626"/>
      <text x="485" y="119" fill="#dc2626" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Double-click</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- ROW 2: STEP 2 — OPEN CHROME EXTENSIONS                                -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 236)" filter="url(#cardShadow)">
    <rect width="1052" height="192" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Column: Step Description -->
    <rect x="24" y="24" width="74" height="26" rx="13" fill="#fee2e2"/>
    <text x="61" y="41" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">STEP 2</text>
    <text x="24" y="78" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Open Extensions</text>
    <text x="24" y="106" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">In the top-right corner of your browser, click</text>
    <text x="24" y="126" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Three Dots (⋮) → Extensions →</text>
    <text x="24" y="146" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Manage Extensions</text>
    <text x="24" y="168" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">(or type chrome://extensions in the address bar)</text>

    <!-- Divider -->
    <line x1="365" y1="20" x2="365" y2="172" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Right Column: Clean Chrome 3-Dots Dropdown Screenshot -->
    <g transform="translate(390, 16)" filter="url(#winShadow)">
      <rect width="642" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Chrome Toolbar Top Right -->
      <rect width="642" height="38" rx="8" fill="#ffffff"/>
      <rect x="14" y="6" width="460" height="26" rx="13" fill="#f1f3f4"/>
      <text x="30" y="23" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11.5">google.com</text>
      <!-- Puzzle & Profile & 3 Dots -->
      <text x="535" y="24" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="14">🧩</text>
      <circle cx="575" cy="19" r="10" fill="#bf360c"/>
      <text x="575" y="23" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">A</text>
      <!-- 3-Dots Icon Highlighted -->
      <circle cx="614" cy="19" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <circle cx="614" cy="14" r="1.6" fill="#202124"/>
      <circle cx="614" cy="19" r="1.6" fill="#202124"/>
      <circle cx="614" cy="24" r="1.6" fill="#202124"/>

      <!-- Main Menu Dropdown -->
      <rect x="396" y="42" width="232" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#winShadow)"/>
      <text x="414" y="63" fill="#202124" font-family="Segoe UI, sans-serif" font-size="12">New tab</text>
      <text x="414" y="84" fill="#202124" font-family="Segoe UI, sans-serif" font-size="12">Downloads</text>
      <rect x="402" y="92" width="220" height="26" rx="4" fill="#f1f5f9"/>
      <text x="414" y="109" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">🧩  Extensions</text>
      <text x="604" y="109" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">▸</text>
      <text x="414" y="136" fill="#202124" font-family="Segoe UI, sans-serif" font-size="12">Settings</text>

      <!-- Submenu -->
      <rect x="180" y="86" width="214" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#winShadow)"/>
      <rect x="186" y="92" width="202" height="26" rx="4" fill="#fee2e2"/>
      <text x="198" y="109" fill="#dc2626" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Manage Extensions</text>
      <text x="198" y="134" fill="#475569" font-family="Segoe UI, sans-serif" font-size="12">Visit Chrome Web Store</text>

      <!-- Clean Red Arrow pointing to Manage Extensions -->
      <path d="M124 105 L174 105" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <polygon points="176,105 166,99 166,111" fill="#dc2626"/>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- ROW 3: STEP 3 — DEVELOPER MODE & LOAD UNPACKED                        -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 448)" filter="url(#cardShadow)">
    <rect width="1052" height="192" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Column: Step Description -->
    <rect x="24" y="24" width="74" height="26" rx="13" fill="#fee2e2"/>
    <text x="61" y="41" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">STEP 3</text>
    <text x="24" y="78" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Enable &amp; Load Unpacked</text>
    <text x="24" y="106" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">1. Turn ON the switch in the top-right:</text>
    <text x="38" y="125" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">“Developer mode”</text>
    <text x="24" y="148" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">2. Click the pill button in the top-left:</text>
    <text x="38" y="167" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">“Load unpacked”</text>

    <!-- Divider -->
    <line x1="365" y1="20" x2="365" y2="172" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Right Column: Exact Modern Chrome Extensions Page Header -->
    <g transform="translate(390, 16)" filter="url(#winShadow)">
      <rect width="642" height="160" rx="8" fill="#f8faf6" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Row A: Chrome Logo + "Extensions" + Search Pill + "Developer mode" Toggle -->
      <rect width="642" height="48" rx="8" fill="#f8faf6"/>
      <circle cx="24" cy="24" r="9" fill="#ea4335"/>
      <circle cx="24" cy="24" r="4" fill="#1a73e8" stroke="#ffffff" stroke-width="2"/>
      <text x="42" y="29" fill="#1f1f1f" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Extensions</text>

      <!-- Centered Search Pill -->
      <rect x="190" y="10" width="220" height="28" rx="14" fill="#e9eee6"/>
      <text x="206" y="28" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="11">🔍  Search extensions</text>

      <!-- Right side: Developer mode + Pill Switch -->
      <text x="514" y="28" fill="#1f1f1f" font-family="Segoe UI, sans-serif" font-size="11.5">Developer mode</text>
      <rect x="604" y="16" width="28" height="16" rx="8" fill="#386a20"/>
      <circle cx="624" cy="24" r="6" fill="#ffffff"/>

      <!-- Red Arrow 1 pointing to Developer Mode Toggle -->
      <path d="M618 62 L618 38" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="618,36 613,45 623,45" fill="#dc2626"/>
      <circle cx="618" cy="74" r="10" fill="#dc2626"/>
      <text x="618" y="78" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">1</text>

      <!-- Row B: Pill Buttons ("Load unpacked", "Pack extension", "Update") -->
      <line x1="0" y1="48" x2="642" y2="48" stroke="#e2e8dc" stroke-width="1"/>
      
      <!-- Pill Button 1 (Highlighted) -->
      <rect x="14" y="58" width="116" height="28" rx="14" fill="#ffffff" stroke="#747775" stroke-width="1"/>
      <rect x="11" y="55" width="122" height="34" rx="17" fill="none" stroke="#dc2626" stroke-width="2"/>
      <text x="72" y="76" text-anchor="middle" fill="#386a20" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600">Load unpacked</text>

      <!-- Pill Button 2 -->
      <rect x="138" y="58" width="106" height="28" rx="14" fill="#ffffff" stroke="#c4c7c5" stroke-width="1"/>
      <text x="191" y="76" text-anchor="middle" fill="#386a20" font-family="Segoe UI, sans-serif" font-size="11">Pack extension</text>

      <!-- Pill Button 3 -->
      <rect x="252" y="58" width="66" height="28" rx="14" fill="#ffffff" stroke="#c4c7c5" stroke-width="1"/>
      <text x="285" y="76" text-anchor="middle" fill="#386a20" font-family="Segoe UI, sans-serif" font-size="11">Update</text>

      <!-- Red Arrow 2 pointing to "Load unpacked" -->
      <path d="M72 118 L72 94" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="72,92 67,101 77,101" fill="#dc2626"/>
      <circle cx="72" cy="130" r="10" fill="#dc2626"/>
      <text x="72" y="134" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">2</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- ROW 4: STEP 4 — SELECT THE EXTENSION FOLDER                           -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 660)" filter="url(#cardShadow)">
    <rect width="1052" height="216" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Column: Step Description -->
    <rect x="24" y="24" width="74" height="26" rx="13" fill="#fee2e2"/>
    <text x="61" y="41" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">STEP 4</text>
    <text x="24" y="78" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Select “extension” folder</text>
    <text x="24" y="106" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Open the folder where you unpacked the archive,</text>
    <text x="24" y="126" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">click the</text>
    <text x="80" y="126" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">extension</text>
    <text x="148" y="126" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">subfolder, and click</text>
    <text x="24" y="146" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">“Select Folder”.</text>
    <text x="24" y="174" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">💡 Or just press Ctrl+V in the “Folder” box</text>
    <text x="24" y="192" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">(the installer automatically copies the path for you)</text>

    <!-- Divider -->
    <line x1="365" y1="20" x2="365" y2="196" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Right Column: Clean Windows Folder Dialog + Installed Card Preview -->
    <g transform="translate(390, 18)" filter="url(#winShadow)">
      <!-- Clean Windows Select Folder Dialog -->
      <rect width="380" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <path d="M0 8 Q0 0 8 0 L372 0 Q380 0 380 8 L380 28 L0 28 Z" fill="#f1f5f9"/>
      <text x="14" y="18" fill="#334155" font-family="Segoe UI, sans-serif" font-size="11">Select the extension directory</text>
      <text x="358" y="18" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">×</text>

      <!-- File list area inside dialog -->
      <rect x="14" y="36" width="352" height="68" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <!-- Selected folder row -->
      <rect x="20" y="44" width="340" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <rect x="28" y="50" width="15" height="12" rx="2" fill="#fbbc04"/>
      <text x="50" y="60" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">extension</text>
      <!-- Second folder row -->
      <rect x="28" y="76" width="15" height="12" rx="2" fill="#fbbc04"/>
      <text x="50" y="86" fill="#475569" font-family="Segoe UI, sans-serif" font-size="12">native_host</text>

      <!-- "Folder:" input field -->
      <text x="14" y="126" fill="#475569" font-family="Segoe UI, sans-serif" font-size="11.5">Folder:</text>
      <rect x="58" y="110" width="308" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="66" y="126" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="12">extension</text>

      <!-- Dialog Buttons -->
      <rect x="190" y="144" width="96" height="26" rx="4" fill="#0284c7"/>
      <text x="238" y="161" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600">Select Folder</text>
      <rect x="294" y="144" width="72" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="330" y="161" text-anchor="middle" fill="#334155" font-family="Segoe UI, sans-serif" font-size="11.5">Cancel</text>

      <!-- Clean Red Arrow pointing to "Select Folder" -->
      <path d="M138 157 L182 157" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <polygon points="184,157 174,151 174,163" fill="#dc2626"/>
    </g>

    <!-- Resulting Chrome Extension Card -->
    <g transform="translate(790, 34)" filter="url(#winShadow)">
      <rect width="238" height="148" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Red Devil Icon -->
      <circle cx="32" cy="36" r="14" fill="#ea4335"/>
      <text x="32" y="41" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13">😈</text>
      <text x="56" y="32" fill="#1f1f1f" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">HellDownloader</text>
      <text x="155" y="32" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="11">1.1.0</text>
      <text x="56" y="50" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="10.5">Universal HTML5 video &amp;</text>
      <text x="56" y="64" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="10.5">fragment clipper up to 4K</text>

      <!-- Bottom pills on card -->
      <rect x="16" y="108" width="66" height="24" rx="12" fill="#ffffff" stroke="#c4c7c5"/>
      <text x="49" y="124" text-anchor="middle" fill="#386a20" font-family="Segoe UI, sans-serif" font-size="10.5">Details</text>
      <rect x="90" y="108" width="58" height="24" rx="12" fill="#ffffff" stroke="#c4c7c5"/>
      <text x="119" y="124" text-anchor="middle" fill="#386a20" font-family="Segoe UI, sans-serif" font-size="10.5">Remove</text>
      <!-- Toggle ON -->
      <rect x="194" y="112" width="28" height="16" rx="8" fill="#386a20"/>
      <circle cx="214" cy="120" r="6" fill="#ffffff"/>

      <!-- Green Ready Badge -->
      <rect x="54" y="78" width="130" height="20" rx="10" fill="#dcfce7"/>
      <text x="119" y="92" text-anchor="middle" fill="#15803d" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">✓ Ready! (Shift+F8)</text>
    </g>
  </g>
</svg>
