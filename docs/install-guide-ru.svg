    <text x="24" y="146" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">extension и нажмите «Выбор папки».</text>
    <text x="24" y="174" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">💡 Или просто нажмите Ctrl+V в строке «Папка»</text>
    <text x="24" y="192" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">(установщик сам копирует путь в буфер обмена)</text>

