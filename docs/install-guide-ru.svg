      <!-- Selected folder row -->
      <rect x="20" y="44" width="340" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
      <rect x="28" y="50" width="15" height="12" rx="2" fill="#fbbc04"/>
      <text x="50" y="60" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">extension</text>
      <!-- Second folder row -->
      <rect x="28" y="76" width="15" height="12" rx="2" fill="#fbbc04"/>
      <text x="50" y="86" fill="#475569" font-family="Segoe UI, sans-serif" font-size="12">native_host</text>

      <!-- "Папка:" input field -->
      <text x="14" y="126" fill="#475569" font-family="Segoe UI, sans-serif" font-size="11.5">Папка:</text>
      <rect x="58" y="110" width="308" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="66" y="126" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="12">extension</text>

      <!-- Dialog Buttons -->
      <rect x="190" y="144" width="96" height="26" rx="4" fill="#0284c7"/>
      <text x="238" y="161" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="600">Выбор папки</text>
      <rect x="294" y="144" width="72" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="330" y="161" text-anchor="middle" fill="#334155" font-family="Segoe UI, sans-serif" font-size="11.5">Отмена</text>

      <!-- Clean Red Arrow pointing to "Выбор папки" -->
      <path d="M138 157 L182 157" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <polygon points="184,157 174,151 174,163" fill="#dc2626"/>
    </g>

    <!-- Resulting Chrome Extension Card (from user screenshot) -->
    <g transform="translate(790, 34)" filter="url(#winShadow)">
      <rect width="238" height="148" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Red Devil Icon -->
      <circle cx="32" cy="36" r="14" fill="#ea4335"/>
      <text x="32" y="41" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13">😈</text>
      <text x="56" y="32" fill="#1f1f1f" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">HellDownloader</text>
      <text x="155" y="32" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="11">1.1.0</text>
      <text x="56" y="50" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="10.5">Universal HTML5 video &amp;</text>
      <text x="56" y="64" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="10.5">fragment clipper up to 4K</text>

      <!-- Bottom pills on card -->
      <rect x="16" y="108" width="66" height="24" rx="12" fill="#ffffff" stroke="#c4c7c5"/>
      <text x="49" y="124" text-anchor="middle" fill="#386a20" font-family="Segoe UI, sans-serif" font-size="10.5">Сведения</text>
      <rect x="90" y="108" width="58" height="24" rx="12" fill="#ffffff" stroke="#c4c7c5"/>
      <text x="119" y="124" text-anchor="middle" fill="#386a20" font-family="Segoe UI, sans-serif" font-size="10.5">Удалить</text>
      <!-- Toggle ON -->
      <rect x="194" y="112" width="28" height="16" rx="8" fill="#386a20"/>
      <circle cx="214" cy="120" r="6" fill="#ffffff"/>

      <!-- Green Ready Badge -->
      <rect x="54" y="78" width="130" height="20" rx="10" fill="#dcfce7"/>
      <text x="119" y="92" text-anchor="middle" fill="#15803d" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">✓ Готово! (Shift+F8)</text>
    </g>
  </g>
</svg>
