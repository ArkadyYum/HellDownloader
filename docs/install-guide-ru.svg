  <!-- ROW 3: ШАГ 3 — РЕЖИМ РАЗРАБОТЧИКА И ЗАГРУЗИТЬ РАСПАКОВАННОЕ           -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 448)" filter="url(#cardShadow)">
    <rect width="1052" height="192" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Column: Step Description -->
    <rect x="24" y="24" width="74" height="26" rx="13" fill="#fee2e2"/>
    <text x="61" y="41" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">ШАГ 3</text>
    <text x="24" y="78" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Включите режим и загрузите</text>
    <text x="24" y="106" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">1. Справа вверху включите тумблер</text>
    <text x="38" y="125" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">«Режим разработчика»</text>
    <text x="24" y="148" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">2. Слева вверху нажмите овальную кнопку</text>
    <text x="38" y="167" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">«Загрузить распакованное расширение»</text>

    <!-- Divider -->
    <line x1="365" y1="20" x2="365" y2="172" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Right Column: Exact Modern Chrome Extensions Page Header (from user screenshot) -->
    <g transform="translate(390, 16)" filter="url(#winShadow)">
      <rect width="642" height="160" rx="8" fill="#f8faf6" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Row A: Chrome Logo + "Расширения" + Search Pill + "Режим разработчика" Toggle -->
      <rect width="642" height="48" rx="8" fill="#f8faf6"/>
      <!-- Chrome 4-color circle -->
      <circle cx="24" cy="24" r="9" fill="#ea4335"/>
      <circle cx="24" cy="24" r="4" fill="#1a73e8" stroke="#ffffff" stroke-width="2"/>
      <text x="42" y="29" fill="#1f1f1f" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Расширения</text>

      <!-- Centered Search Pill -->
      <rect x="190" y="10" width="220" height="28" rx="14" fill="#e9eee6"/>
      <text x="206" y="28" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="11">🔍  Поиск расширений</text>

      <!-- Right side: Режим разработчика + Green/Dark Pill Switch -->
      <text x="492" y="28" fill="#1f1f1f" font-family="Segoe UI, sans-serif" font-size="11.5">Режим разработчика</text>
      <rect x="604" y="16" width="28" height="16" rx="8" fill="#386a20"/>
      <circle cx="624" cy="24" r="6" fill="#ffffff"/>

      <!-- Red Arrow 1 pointing to Developer Mode Toggle -->
      <path d="M618 62 L618 38" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="618,36 613,45 623,45" fill="#dc2626"/>
      <circle cx="618" cy="74" r="10" fill="#dc2626"/>
      <text x="618" y="78" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">1</text>

      <!-- Row B: Pill Buttons ("Загрузить распакованное расширение", "Упаковать расширение", "Обновить") -->
      <line x1="0" y1="48" x2="642" y2="48" stroke="#e2e8dc" stroke-width="1"/>
      
      <!-- Pill Button 1 (Highlighted) -->
      <rect x="14" y="58" width="206" height="28" rx="14" fill="#ffffff" stroke="#747775" stroke-width="1"/>
      <rect x="11" y="55" width="212" height="34" rx="17" fill="none" stroke="#dc2626" stroke-width="2"/>
      <text x="117" y="76" text-anchor="middle" fill="#386a20" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Загрузить распакованное расширение</text>

      <!-- Pill Button 2 -->
      <rect x="228" y="58" width="128" height="28" rx="14" fill="#ffffff" stroke="#c4c7c5" stroke-width="1"/>
      <text x="292" y="76" text-anchor="middle" fill="#386a20" font-family="Segoe UI, sans-serif" font-size="11">Упаковать расширение</text>

      <!-- Pill Button 3 -->
      <rect x="364" y="58" width="70" height="28" rx="14" fill="#ffffff" stroke="#c4c7c5" stroke-width="1"/>
      <text x="399" y="76" text-anchor="middle" fill="#386a20" font-family="Segoe UI, sans-serif" font-size="11">Обновить</text>

      <!-- Red Arrow 2 pointing to "Загрузить распакованное расширение" -->
      <path d="M117 118 L117 94" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="117,92 112,101 122,101" fill="#dc2626"/>
      <circle cx="117" cy="130" r="10" fill="#dc2626"/>
      <text x="117" y="134" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">2</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- ROW 4: ШАГ 4 — ВЫБЕРИТЕ ПАПКУ EXTENSION                               -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 660)" filter="url(#cardShadow)">
    <rect width="1052" height="216" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Column: Step Description -->
    <rect x="24" y="24" width="74" height="26" rx="13" fill="#fee2e2"/>
    <text x="61" y="41" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">ШАГ 4</text>
    <text x="24" y="78" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Выберите папку «extension»</text>
    <text x="24" y="106" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">В открывшемся окне зайдите в папку, куда</text>
