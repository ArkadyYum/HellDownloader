<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="winShadow" x="-4%" y="-5%" width="108%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Main Canvas Background -->
  <rect width="1100" height="900" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="1098" height="898" rx="15" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===================================================================== -->
  <!-- ROW 1: ШАГ 1 — ЗАПУСТИТЕ INSTALL.BAT                                  -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 24)" filter="url(#cardShadow)">
    <rect width="1052" height="192" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Left Column: Step Description -->
    <rect x="24" y="24" width="74" height="26" rx="13" fill="#fee2e2"/>
    <text x="61" y="41" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">ШАГ 1</text>
    <text x="24" y="78" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Запустите установщик</text>
    <text x="24" y="106" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Распакуйте скачанный архив в любую удобную</text>
    <text x="24" y="126" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">папку и дважды кликните по файлу</text>
    <text x="24" y="146" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">install.bat</text>

    <!-- Divider -->
    <line x1="365" y1="20" x2="365" y2="172" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Right Column: Clean Windows Explorer Screenshot -->
    <g transform="translate(390, 16)" filter="url(#winShadow)">
      <rect width="642" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Win11 Titlebar -->
      <path d="M0 8 Q0 0 8 0 L634 0 Q642 0 642 8 L642 28 L0 28 Z" fill="#f1f5f9"/>
      <rect x="12" y="8" width="14" height="11" rx="2" fill="#fbbc04"/>
      <text x="34" y="18" fill="#334155" font-family="Segoe UI, sans-serif" font-size="11">HellDownloader_Setup — Проводник</text>
      <text x="618" y="18" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">×</text>

      <!-- Table Header -->
      <text x="20" y="46" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Имя</text>
      <text x="280" y="46" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Тип</text>
      <line x1="12" y1="52" x2="630" y2="52" stroke="#f1f5f9" stroke-width="1"/>

      <!-- File 1: extension -->
      <rect x="20" y="60" width="16" height="13" rx="2" fill="#fbbc04"/>
      <text x="44" y="71" fill="#1e293b" font-family="Segoe UI, sans-serif" font-size="12">extension</text>
      <text x="280" y="71" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Папка с файлами</text>

      <!-- File 2: native_host -->
      <rect x="20" y="82" width="16" height="13" rx="2" fill="#fbbc04"/>
      <text x="44" y="93" fill="#1e293b" font-family="Segoe UI, sans-serif" font-size="12">native_host</text>
      <text x="280" y="93" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Папка с файлами</text>

      <!-- File 3: install.bat (Selected) -->
      <rect x="12" y="102" width="390" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="20" y="108" width="16" height="14" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1"/>
      <rect x="20" y="108" width="16" height="4" fill="#0284c7"/>
      <text x="44" y="119" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">install.bat</text>
      <text x="280" y="119" fill="#0369a1" font-family="Segoe UI, sans-serif" font-size="11">Пакетный файл Windows</text>

      <!-- File 4: uninstall.bat -->
      <rect x="20" y="135" width="16" height="14" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <rect x="20" y="135" width="16" height="4" fill="#64748b"/>
      <text x="44" y="146" fill="#1e293b" font-family="Segoe UI, sans-serif" font-size="12">uninstall.bat</text>
      <text x="280" y="146" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Пакетный файл Windows</text>

      <!-- Clean Red Arrow -->
      <path d="M475 115 L412 115" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <polygon points="410,115 420,109 420,121" fill="#dc2626"/>
      <text x="485" y="119" fill="#dc2626" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Двойной клик</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- ROW 2: ШАГ 2 — ОТКРОЙТЕ МЕНЮ РАСШИРЕНИЙ В CHROME                      -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 236)" filter="url(#cardShadow)">
    <rect width="1052" height="192" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Left Column: Step Description -->
    <rect x="24" y="24" width="74" height="26" rx="13" fill="#fee2e2"/>
    <text x="61" y="41" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">ШАГ 2</text>
    <text x="24" y="78" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Откройте «Расширения»</text>
    <text x="24" y="106" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">В правом верхнем углу браузера нажмите на</text>
    <text x="24" y="126" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">три точки (⋮) → Расширения →</text>
    <text x="24" y="146" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Управление расширениями</text>
    <text x="24" y="168" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">(или введите в адресную строку chrome://extensions)</text>

    <!-- Divider -->
    <line x1="365" y1="20" x2="365" y2="172" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Right Column: Clean Chrome 3-Dots Dropdown Screenshot -->
    <g transform="translate(390, 16)" filter="url(#winShadow)">
      <rect width="642" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Chrome Toolbar Top Right -->
      <rect width="642" height="38" rx="8" fill="#ffffff"/>
      <rect x="14" y="6" width="460" height="26" rx="13" fill="#f1f3f4"/>
      <text x="30" y="23" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11.5">google.com</text>
      <!-- Puzzle & Profile & 3 Dots -->
      <text x="535" y="24" fill="#5f6368" font-family="Segoe UI, sans-serif" font-size="14">🧩</text>
      <circle cx="575" cy="19" r="10" fill="#bf360c"/>
      <text x="575" y="23" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">A</text>
      <!-- 3-Dots Icon Highlighted -->
      <circle cx="614" cy="19" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <circle cx="614" cy="14" r="1.6" fill="#202124"/>
      <circle cx="614" cy="19" r="1.6" fill="#202124"/>
      <circle cx="614" cy="24" r="1.6" fill="#202124"/>

      <!-- Main Menu Dropdown -->
      <rect x="396" y="42" width="232" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#winShadow)"/>
      <text x="414" y="63" fill="#202124" font-family="Segoe UI, sans-serif" font-size="12">Новая вкладка</text>
      <text x="414" y="84" fill="#202124" font-family="Segoe UI, sans-serif" font-size="12">Скачанные файлы</text>
      <rect x="402" y="92" width="220" height="26" rx="4" fill="#f1f5f9"/>
      <text x="414" y="109" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">🧩  Расширения</text>
      <text x="604" y="109" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">▸</text>
      <text x="414" y="136" fill="#202124" font-family="Segoe UI, sans-serif" font-size="12">Настройки</text>

      <!-- Submenu -->
      <rect x="166" y="86" width="228" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#winShadow)"/>
      <rect x="172" y="92" width="216" height="26" rx="4" fill="#fee2e2"/>
      <text x="184" y="109" fill="#dc2626" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Управление расширениями</text>
      <text x="184" y="134" fill="#475569" font-family="Segoe UI, sans-serif" font-size="12">Интернет-магазин Chrome</text>

      <!-- Clean Red Arrow pointing to Управление расширениями -->
      <path d="M110 105 L160 105" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <polygon points="162,105 152,99 152,111" fill="#dc2626"/>
    </g>
  </g>

